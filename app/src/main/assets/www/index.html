<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Endless Racing Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div class="panel">
                <div class="label">SPEED</div>
                <div class="value"><span id="speedVal">0</span> <span class="unit">km/h</span></div>
            </div>
            <div class="panel">
                <div class="label">DISTANCE</div>
                <div class="value"><span id="scoreVal">0</span> <span class="unit">m</span></div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div id="controls">
            <div id="btn-left">◀</div>
            <div id="btn-right">▶</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
